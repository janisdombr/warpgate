name: Stall hunt

# Fork-only. Not part of PR #2549.
#
# The question: when a client stops reading until its SSH channel window is
# empty and its target then dies, how long does the gateway hold the client's
# TCP connection? Measured on macOS it is never -- still held at 240s, with a
# reading client released in 3s. Warpgate runs on Linux, and the mechanism
# runs through the kernel's handling of a write to a zero-window peer, which
# is not the same code on the two platforms. So the number that decides what
# PR #2549 may claim is the Linux one, and this is where it is taken.
#
# `tests/test_stall_unread_client_release.py` is a measuring instrument, not a
# regression test. It refuses to infer that the client stalled, that the
# gateway let go, or that its threshold means anything -- and this workflow
# adds the fourth refusal that only a port needs: it will not report a number
# until the socket parser has been shown to read a live connection on this
# runner.

on:
  push:
    branches: [ "tooling/stall-hunt" ]
  workflow_dispatch:
    inputs:
      iterations:
        description: "Stalled iterations to measure"
        default: "3"
      inactivity:
        description: "ssh.inactivity_timeout for the gateway under test"
        default: "15s"
      observe:
        description: "Seconds to watch for a release after the target dies"
        default: "240"
      target_kill:
        description: "relay (instant RST) or docker (real container kill)"
        default: "relay"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: "test"

      - name: Install build deps
        run: |
          sudo apt-get install -y openssh-client expect lsof iproute2
          cargo install --locked just@1.4.0

      # Seconds, no imports: does this runner's `ss` emit the three things
      # the parser is built on at all? A kernel or an iproute2 that does not
      # is worth learning about before ten minutes of build.
      - name: Does this kernel report what the parser reads
        run: |
          set -e
          ss -tanmi > /tmp/ss-probe.txt || { echo "ss is not usable here"; exit 1; }
          grep -q 'skmem:(' /tmp/ss-probe.txt || { echo "no skmem in ss -m output"; head -40 /tmp/ss-probe.txt; exit 1; }
          grep -qE 'bytes_(sent|received):' /tmp/ss-probe.txt || { echo "no byte counters in ss -i output"; head -40 /tmp/ss-probe.txt; exit 1; }
          echo "ss reports skmem and byte counters; the real probe runs once deps are installed"

      - name: Build UI
        run: |
          just npm ci
          just openapi
          just npm run openapi:tests-sdk
          just npm run build

      - name: Build the gateway
        run: cargo build --bin warpgate --all-features

      - name: Build images
        working-directory: tests
        run: make all

      - name: Install deps
        working-directory: tests
        run: |
          pip3 install poetry==1.8.3
          # --no-root: `tests` is a dependency set, not a package, and newer
          # poetry refuses to install it as one. Not `|| true`, which would
          # also swallow a dependency that genuinely failed to resolve.
          poetry install --no-root

      # The real one. `tests` is a package and the harness imports its
      # siblings, so it cannot be loaded as a loose file -- which is what the
      # first attempt at this step got wrong. Run from the repo root, through
      # the venv that now has the deps, against a loopback connection this
      # step fills itself. Still ahead of the measurement, which is the part
      # that costs iterations x OBSERVE_S.
      - name: Prove the socket parser reads a live connection
        working-directory: tests
        run: |
          poetry run python - <<'PY'
          import pathlib, socket, sys, threading, time
          sys.path.insert(0, str(pathlib.Path.cwd().parent))
          from tests.test_stall_unread_client_release import (
              _IS_LINUX, _SOCKET_CMD, _conn_rows, _socket_dump,
          )

          print("platform:", sys.platform, "-> linux:", _IS_LINUX)
          print("command:", " ".join(_SOCKET_CMD))
          assert _IS_LINUX, "this job exists to take the Linux number"

          srv = socket.socket()
          srv.bind(("127.0.0.1", 0))
          srv.listen(1)
          port = srv.getsockname()[1]
          # Kept, not discarded: an accepted socket nobody holds is collected
          # and closed, and the connection this step is about stops existing
          # before anything can read it out of the kernel.
          accepted = []
          threading.Thread(
              target=lambda: accepted.append(srv.accept()), daemon=True
          ).start()
          cli = socket.create_connection(("127.0.0.1", port))
          cli.sendall(b"x" * 4096)
          time.sleep(0.5)

          raw = _socket_dump()
          pathlib.Path("parser-probe.txt").write_text(raw)
          gw, cl = _conn_rows(port, cli.getsockname()[1])
          assert gw is not None, f"no row for the server side of 127.0.0.1:{port}\n{raw[:3000]}"
          assert cl is not None, f"no row for the client side\n{raw[:3000]}"
          # The three fields every downstream assertion is built on. Finding
          # the line but not these would read as a socket that never filled.
          assert gw["rhiwat"] > 0, f"no rb in skmem: {gw['line']}"
          assert cl["shiwat"] > 0, f"no tb in skmem: {cl['line']}"
          assert gw["rxbytes"] >= 4096 or cl["txbytes"] >= 4096, (
              f"byte counters not parsed:\n  server {gw['line']}\n  client {cl['line']}"
          )
          print("server:", gw["line"])
          print("client:", cl["line"])
          print("the parser reads this kernel: recvq/sendq, rb/tb and byte counters all present")
          PY

      - name: Measure
        working-directory: tests
        env:
          WG_INACTIVITY: ${{ github.event.inputs.inactivity || '15s' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '3' }}
          OBSERVE_S: ${{ github.event.inputs.observe || '240' }}
          THRESHOLD_S: ${{ github.event.inputs.observe || '240' }}
          TARGET_KILL: ${{ github.event.inputs.target_kill || 'relay' }}
          SHARD_ID: linux
          TIMEOUT: "120"
        run: |
          # Not `|| exit 1`: a red assertion here is the finding, and the
          # artefacts below are what the finding is read from.
          poetry run pytest test_stall_unread_client_release.py \
            -q -s --tb=short -p no:randomly || echo "STALL_HUNT_RED=1" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stall-artifacts-linux
          path: |
            tests/stall-artifacts/**
            tests/parser-probe.txt
          if-no-files-found: warn

      - name: Say what happened
        if: always()
        run: |
          if [ "${STALL_HUNT_RED:-0}" = "1" ]; then
            echo "The gateway did not release a stalled client within the threshold on Linux." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The gateway released every stalled client within the threshold on Linux." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Raw socket output and per-iteration evidence are in the stall-artifacts-linux artifact." >> "$GITHUB_STEP_SUMMARY"
