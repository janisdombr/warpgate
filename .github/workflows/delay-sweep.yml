name: Delay sweep

# Fork-only. Looks for a delay at which the hang is certain rather than one in
# a hundred. A deterministic reproduction is worth more than six hundred
# attempts: it can be shown to a reviewer in seconds and it can be a
# regression test that is not itself a flake.

on:
  push:
    branches: [ "tooling/delay-sweep" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: "test"
      - name: Install build deps
        run: |
          sudo apt-get install openssh-client expect
          cargo install --locked just@1.4.0
      - name: Build UI
        run: |
          just npm ci
          just openapi
          just npm run openapi:tests-sdk
          just npm run build
      - name: Build the gateway
        run: cargo build --bin warpgate
      - name: Install deps
        working-directory: tests
        run: |
          pip3 install poetry==1.8.3
          poetry install
      - name: Sweep
        working-directory: tests
        run: TIMEOUT=120 poetry run pytest test_delay_sweep.py -q -s --tb=short
