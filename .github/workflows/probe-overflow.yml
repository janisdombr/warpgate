name: Probe stack overflow

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "channels opened while the gate is held"
        default: "16"
      settle:
        description: "seconds to let the opens queue before approving"
        default: "8"
  push:
    branches: [probe/ssh-stack-overflow]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: [baseline, cap2, cap1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false
          docker-images: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: "probe-${{ matrix.cell }}"

      - name: Apply the cell's source
        run: |
          case "${{ matrix.cell }}" in
            cap2) sed -i 's/^const MAX_NESTED_COMMAND_WAITS: usize = 16;/const MAX_NESTED_COMMAND_WAITS: usize = 2;/' warpgate-protocol-ssh/src/server/session.rs ;;
            cap1) sed -i 's/^const MAX_NESTED_COMMAND_WAITS: usize = 16;/const MAX_NESTED_COMMAND_WAITS: usize = 1;/' warpgate-protocol-ssh/src/server/session.rs ;;
          esac
          # Fingerprint: what this cell actually compiled, printed above the numbers.
          echo "CELL=${{ matrix.cell }}"
          grep -n '^const MAX_NESTED_COMMAND_WAITS' warpgate-protocol-ssh/src/server/session.rs

      - name: Install build deps
        run: |
          sudo apt-get install openssh-client expect
          cargo install --locked just@1.4.0
          cargo install --locked cargo-llvm-cov@0.6.15
          rustup component add llvm-tools-preview

      - name: Build UI
        run: |
          just npm ci
          just openapi
          just npm run openapi:tests-sdk
          just npm run build

      - name: Build images
        working-directory: tests
        run: make all

      - name: Install test deps
        working-directory: tests
        run: |
          sudo apt update
          sudo apt install -y gnome-keyring
          pip3 install keyring==24 poetry==1.8.3
          poetry install

      - name: Build the gateway the way the test suite does
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-cfg-coverage-nightly --no-report --workspace --all-features -- --skip agent

      - name: Run the probe
        working-directory: tests
        env:
          PROBE_CHANNELS: ${{ github.event.inputs.channels || '16' }}
          PROBE_SETTLE: ${{ github.event.inputs.settle || '8' }}
          TIMEOUT: "120"
          ENABLE_COVERAGE: "1"
          RUST_BACKTRACE: "1"
        run: |
          set +e
          crashes=0
          for i in 1 2 3; do
            poetry run pytest test_zz_overflow_probe.py -s -p no:cacheprovider > probe-$i.log 2>&1
            rc=$?
            c=$(grep -c 'overflowed its stack' probe-$i.log)
            echo "run $i: pytest exit=$rc stack_overflow=$c max_wait_depth=$(grep -oE 'PROBE command wait entered probe="wait" depth=[0-9]+' probe-$i.log | grep -oE '[0-9]+$' | sort -n | tail -1)"
            crashes=$((crashes + c))
          done
          cp probe-3.log probe.log
          echo "CELL ${{ matrix.cell }}: $crashes of 3 runs aborted the gateway"
          echo "=== cell ${{ matrix.cell }} : PROBE lines"
          grep -E 'PROBE command wait entered' probe.log | tail -20
          echo "=== deepest replay depth reached"
          grep -oE 'probe="wait" depth=[0-9]+' probe.log | grep -oE '[0-9]+$' | sort -n | tail -1
          echo "=== stack bytes per replay level (sp deltas)"
          grep -oE 'probe="wait" depth=[0-9]+ sp=[0-9]+' probe.log | tail -14
          echo "=== crash?"
          grep -c 'overflowed its stack' probe.log
          echo "=== backtrace at depth 6, if any"
          sed -n '/PROBE deep command wait/,+45p' probe.log | head -60

      - name: The suites that exercise the pump must stay green
        working-directory: tests
        env:
          TIMEOUT: "120"
          ENABLE_COVERAGE: "1"
        run: |
          set +e
          poetry run pytest test_ssh_approval_close.py test_ssh_proto.py test_ssh_host_keys.py -q -p no:cacheprovider > suite.log 2>&1
          echo "suite exit=$? :: $(grep -E '^[0-9]+ (passed|failed)|=+ .*(passed|failed)' suite.log | tail -1)"
          grep -E '^FAILED' suite.log | head -10
          grep -c 'overflowed its stack' suite.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-${{ matrix.cell }}
          path: |
            tests/probe-*.log
            tests/suite.log
