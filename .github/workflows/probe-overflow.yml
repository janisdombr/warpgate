name: Probe stack overflow

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "channels opened while the gate is held"
        default: "16"
      settle:
        description: "seconds to let the opens queue before approving"
        default: "8"
  push:
    branches: [probe/ssh-stack-overflow]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: [fixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false
          docker-images: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: "probe-${{ matrix.cell }}"

      - name: Apply the cell's source
        run: |
          # Fingerprint: this cell is upstream's fix as published, unmodified.
          echo "CELL=${{ matrix.cell }} head=$(git rev-parse --short HEAD)"
          echo "dispatches left inside the wait: $(grep -c 'handle_event(event).await' warpgate-protocol-ssh/src/server/session.rs || true)"
          echo "events parked for the main loop: $(grep -c 'Some(event) => self.pending_events.push_back(event)' warpgate-protocol-ssh/src/server/session.rs || true)"
          echo "old cap still present: $(grep -c 'MAX_NESTED_COMMAND_WAITS' warpgate-protocol-ssh/src/server/session.rs || true)"

      - name: Install build deps
        run: |
          sudo apt-get install openssh-client expect
          cargo install --locked just@1.4.0
          cargo install --locked cargo-llvm-cov@0.6.15
          rustup component add llvm-tools-preview

      - name: Build UI
        run: |
          just npm ci
          just openapi
          just npm run openapi:tests-sdk
          just npm run build

      - name: Build images
        working-directory: tests
        run: make all

      - name: Install test deps
        working-directory: tests
        run: |
          sudo apt update
          sudo apt install -y gnome-keyring
          pip3 install keyring==24 poetry==1.8.3
          poetry install

      - name: Build the gateway the way the test suite does
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-cfg-coverage-nightly --no-report --workspace --all-features -- --skip agent

      - name: Run the probe
        working-directory: tests
        env:
          PROBE_CHANNELS: ${{ github.event.inputs.channels || '16' }}
          PROBE_SETTLE: ${{ github.event.inputs.settle || '8' }}
          TIMEOUT: "120"
          ENABLE_COVERAGE: "1"
          RUST_BACKTRACE: "1"
        run: |
          set +e
          crashes=0
          for i in 1 2 3; do
            poetry run pytest test_zz_overflow_probe.py -s -p no:cacheprovider > probe-$i.log 2>&1
            rc=$?
            c=$(grep -c 'overflowed its stack' probe-$i.log || true)
            echo "run $i: pytest exit=$rc stack_overflow=$c"
            crashes=$((crashes + c))
          done
          cp probe-3.log probe.log
          echo "CELL ${{ matrix.cell }}: $crashes of 3 runs aborted the gateway"
          echo "=== crash?"
          echo "stack overflows: $(grep -c 'overflowed its stack' probe.log || true)"

      - name: The suites that exercise the pump must stay green
        working-directory: tests
        env:
          TIMEOUT: "120"
          ENABLE_COVERAGE: "1"
        run: |
          set +e
          poetry run pytest test_ssh_approval_close.py test_ssh_proto.py test_ssh_host_keys.py -q -p no:cacheprovider > suite.log 2>&1
          echo "suite exit=$? :: $(grep -E '^[0-9]+ (passed|failed)|=+ .*(passed|failed)' suite.log | tail -1)"
          grep -E '^FAILED' suite.log | head -10
          echo "stack overflows during the suite: $(grep -c 'overflowed its stack' suite.log || true)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-${{ matrix.cell }}
          path: |
            tests/probe-*.log
            tests/suite.log
